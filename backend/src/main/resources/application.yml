server:
  port: 8090

paike:
  report:
    # 绝对路径，或相对于后端进程工作目录的路径；部署环境推荐使用绝对路径。
    dir: ${PAIKE_REPORT_DIR:data/reports}

spring:
  application:
    name: scheduler-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/paike?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    # 数据库账号/密码不再保留硬编码默认值，避免线上误用 root/123456。
    # 本地开发请把 backend/.env.example 复制为 .env，或通过环境变量 DB_USERNAME / DB_PASSWORD 注入。
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    # 本项目当前无文件上传端点；此处为将来引入上传时预置护栏。
    # JSON 请求体上限由 RequestBodySizeLimitFilter（app.security.max-request-body-size）负责。
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:2MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:5MB}
  sql:
    init:
      # 本项目不引入 Flyway/Liquibase；初始化由 spring.sql.init + SemesterSchemaInitializer 兜底。详见 db/README.md。
      # 三套初始化入口的执行顺序与职责边界见 backend/src/main/resources/db/README.md。
      # 新增 schema 改动请追加新的 v*.sql 到 schema-locations 末尾，并保持幂等。
      mode: always
      schema-locations: classpath:db/schema.sql,classpath:db/v2_schema.sql,classpath:db/v2_alter_schedule.sql,classpath:db/v2_alter_score_report.sql,classpath:db/v3_semester.sql,classpath:db/v3_semester_data_bind.sql,classpath:db/v3_schedule_plan.sql,classpath:db/v3_score.sql,classpath:db/v5_stage1.sql,classpath:db/v5_stage3.sql,classpath:db/v5_stage6.sql,classpath:db/v6_bugfix_constraints.sql,classpath:db/v6_schedule_index.sql,classpath:db/v6_semester_current_unique.sql,classpath:db/v7_soft_delete_plan_semester.sql,classpath:db/v8_unscheduled_task_semester.sql,classpath:db/v9_auto_schedule_batch_update_time.sql,classpath:db/v10_teaching_task_index.sql,classpath:db/v11_soft_delete_three_tables.sql,classpath:db/v12_system_audit_log.sql,classpath:db/v13_score_report_semester.sql,classpath:db/v14_missing_v4_v5_tables_and_schedule_keys.sql,classpath:db/v15_sys_user_role.sql,classpath:db/v16_schedule_search_order_index.sql,classpath:db/v17_report_batch_semester.sql,classpath:db/v18_schedule_report_semester_deleted.sql,classpath:db/v19_score_detail_deleted.sql,classpath:db/v20_schedule_conflict_related_ids_text.sql,classpath:db/v21_performance_baseline_record.sql,classpath:db/v22_schedule_semester_unique.sql,classpath:db/v23_week_type_support.sql,classpath:db/v24_continuous_week_range.sql
      # 迁移脚本必须幂等；失败应中断启动，避免真实 schema 错误被吞掉。
      continue-on-error: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.paike.scheduler: info

app:
  jwt:
    # JWT_SECRET 必须由环境变量显式注入；JwtService 启动时还会再次校验长度与默认值。
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  security:
    # 生产环境（HTTPS）请把 COOKIE_SECURE 设为 true，让 JWT / CSRF cookie 仅允许在 HTTPS 上携带
    cookie-secure: ${COOKIE_SECURE:false}
    # 仅在受信任反向代理已清洗 X-Forwarded-For / X-Real-IP 时开启。
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    # JSON 请求体大小上限（字节），由 RequestBodySizeLimitFilter 按 Content-Length 和读取流量兜底，默认 2MB。
    # 生产入口仍建议同步配置 nginx client_max_body_size。
    max-request-body-size: ${MAX_REQUEST_BODY_SIZE:2097152}
  cors:
    # 允许跨域的来源；多个用逗号分隔。同源部署（nginx 反代）下 CORS 不参与，留空即可
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    # 仅当确实要让浏览器跨域携带 cookie 时才开启，开启后 allowed-origins 不能用 "*"
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1/chat/completions}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-ms: ${AI_TIMEOUT_MS:20000}
  schedule:
    thresholds:
      teacher-overload-medium: 18
      teacher-overload-high: 22
      class-daily-overload-medium: 8
      class-daily-overload-high: 10
      room-low-utilization: 30
      room-high-utilization: 85
      total-available-periods: 20
      afternoon-start-period: 5
