server:
  port: 8090

spring:
  application:
    name: scheduler-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/paike?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql,classpath:db/v2_schema.sql,classpath:db/v3_semester.sql,classpath:db/v3_semester_data_bind.sql,classpath:db/v3_schedule_plan.sql
      continue-on-error: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.paike.scheduler: info

app:
  jwt:
    secret: ${JWT_SECRET:replace_with_a_strong_secret_key_for_stage3_v1_auth}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
