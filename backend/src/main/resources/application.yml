server:
  port: 8090

spring:
  application:
    name: scheduler-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/paike?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    # 数据库账号/密码不再保留硬编码默认值，避免线上误用 root/123456。
    # 本地开发请把 backend/.env.example 复制为 .env，或通过环境变量 DB_USERNAME / DB_PASSWORD 注入。
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql,classpath:db/v2_schema.sql,classpath:db/v2_alter_schedule.sql,classpath:db/v2_alter_score_report.sql,classpath:db/v3_semester.sql,classpath:db/v3_semester_data_bind.sql,classpath:db/v3_schedule_plan.sql,classpath:db/v3_score.sql,classpath:db/v5_stage1.sql,classpath:db/v5_stage3.sql,classpath:db/v5_stage6.sql,classpath:db/v6_bugfix_constraints.sql,classpath:db/v6_schedule_index.sql,classpath:db/v6_semester_current_unique.sql,classpath:db/v7_soft_delete_plan_semester.sql
      continue-on-error: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.paike.scheduler: info

app:
  jwt:
    # JWT_SECRET 必须由环境变量显式注入；JwtService 启动时还会再次校验长度与默认值。
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  security:
    # 生产环境（HTTPS）请把 COOKIE_SECURE 设为 true，让 JWT / CSRF cookie 仅允许在 HTTPS 上携带
    cookie-secure: ${COOKIE_SECURE:false}
  cors:
    # 允许跨域的来源；多个用逗号分隔。同源部署（nginx 反代）下 CORS 不参与，留空即可
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    # 仅当确实要让浏览器跨域携带 cookie 时才开启，开启后 allowed-origins 不能用 "*"
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1/chat/completions}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-ms: ${AI_TIMEOUT_MS:20000}
